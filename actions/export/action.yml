name: Export HDF results with the SAF CLI
description: >
  Exports HDF results with one of the SAF CLI's hdf2<format> converters: a
  STIG Viewer checklist (ckl), XCCDF results (xccdf), CSV, an HTML report or
  a CAAT spreadsheet. The SAF CLI's converters exit 0 even when they fail,
  so this step checks what they wrote. Needs the install action first. The
  GitHub Actions twin of the orb's export command.
author: juburr

inputs:
  input:
    description: >
      The HDF files to export: paths or globs, separated by commas,
      spaces or newlines. Empty: the files the last convert action wrote
      (SAF_HDF_FILES). A leading ~ is the home directory, and
      environment variables are expanded.
    default: ""
  format:
    description: >
      ckl, xccdf and csv write a file per HDF file (.ckl, .xml, .csv);
      html and caat put every HDF file in one (.html, .xlsx). The SAF
      CLI 1.5.3 has no html. One of: ckl, xccdf, csv, html, caat.
    required: true
  extra_args:
    description: >
      The format's own options, split like shell words: for ckl, the
      asset and STIG metadata (--metadata with a file from saf generate
      ckl_metadata, --hostname, --ip, --fqdn, --role, --marking and the
      others hdf2ckl takes); for csv, --fields and --noTruncate; for
      html, --type Executive, Manager or Administrator.
    default: ""
  output_dir:
    description: >
      Absolute path of the directory for the exports.
    default: "/tmp/saf-reports"
  report_name:
    description: >
      The exports' name. Empty: each HDF file's own name (results.json
      gives results.ckl), and for html and caat the first HDF file's.
      With several HDF files and a per-file format, <report_name>-<HDF
      file's name>.
    default: ""
  store_artifacts:
    description: >
      Upload output_dir as an artifact.
    default: "true"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same action
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=saf-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: SAF CLI export
      shell: bash
      env:
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FORMAT: ${{ inputs.format }}
        PARAM_INPUT: ${{ inputs.input }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/export.sh"
        "SCRIPT_SAF_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/saf.sh"
    - name: Upload the artifact
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
