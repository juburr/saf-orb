name: Summarize HDF results with the SAF CLI
description: >
  Summarizes HDF results with the SAF CLI's view summary: per profile, its
  compliance and how many controls passed, failed, were not reviewed, were
  not applicable or had an error, by severity. The table goes to the log
  (and on GitHub Actions to the job's summary page), and to output_dir in
  the formats asked for. Needs the install action first. The GitHub Actions
  twin of the orb's summary command.
author: juburr

inputs:
  input:
    description: >
      The HDF files to summarize: paths or globs, separated by commas,
      spaces or newlines. Files whose first profile has the same name
      are added up. Empty: the files the last convert action wrote
      (SAF_HDF_FILES). A leading ~ is the home directory, and
      environment variables are expanded.
    default: ""
  formats:
    description: >
      The formats to write to output_dir, separated by commas or spaces:
      json (<report_name>.json), yaml (.yml) and markdown (.md). Empty
      writes none: the summary goes to the log only.
    default: "json markdown"
  step_summary:
    description: >
      Add the table to the job's summary page.
    default: "true"
  output_dir:
    description: >
      Absolute path of the directory for the summary.
    default: "/tmp/saf-reports"
  report_name:
    description: >
      The name the summary's files start with.
    default: summary
  store_artifacts:
    description: >
      Upload output_dir as an artifact.
    default: "true"

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same action
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=saf-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: SAF CLI summary
      shell: bash
      env:
        PARAM_FORMATS: ${{ inputs.formats }}
        PARAM_INPUT: ${{ inputs.input }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_STEP_SUMMARY: ${{ inputs.step_summary }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/summary.sh"
        "SCRIPT_SAF_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/saf.sh"
    - name: Upload the artifact
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
